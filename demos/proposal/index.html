<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ჩვენი ისტორია</title>
  <meta name="description" content="კინემატოგრაფიული ხელის თხოვნა — MOMENTLY-ის დემო.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07060c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Noto+Sans+Georgian:wght@300;400;500&family=Noto+Serif+Georgian:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-locked bars">

<!--
  All texts and photos come from CONFIG at the top of script.js.
  A joke-gift version lives in CONFIG.jokeVersion — preview it with ?v=joke
-->

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.5-4.6-10-9.3C.3 8.4 2 4 6.2 4c2.3 0 3.8 1.3 4.8 2.8C12 5.3 13.5 4 15.8 4 20 4 21.7 8.4 22 11.7 19.5 16.4 12 21 12 21z"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></g></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path fill="currentColor" d="M3 1.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2A.8.8 0 0 0 3 1.8z"/></symbol>
</svg>

<canvas class="sky" id="sky" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- ============ 1. Title card ============ -->
<section class="title-card" id="titleCard" aria-labelledby="tcTitle">
  <p class="tc__pre" style="--d:.4s" id="tcPre"></p>
  <h1 class="tc__title" style="--d:1.1s" id="tcTitle" data-c="intro.title"></h1>
  <span class="tc__line" style="--d:1.8s" aria-hidden="true"></span>
  <p class="tc__credits" style="--d:2.2s" data-c="intro.credits"></p>
  <button class="play" style="--d:2.9s" type="button" id="playBtn">
    <span class="play__icon" aria-hidden="true"><svg><use href="#i-play"/></svg></span>
    <span data-c="intro.start"></span>
  </button>
  <p class="tc__sound" style="--d:3.4s" data-c="intro.soundHint"></p>
</section>

<!-- ============ 2. Story + 3. Question ============ -->
<main class="story" id="story" aria-hidden="true">
  <div id="scenes"><!-- chapters are rendered from CONFIG.chapters --></div>

  <section class="scene question" id="question" aria-labelledby="qTitle">
    <div class="arena" id="arena">
      <div class="q">
        <div class="ring fade" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <defs>
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1cc"/><stop offset=".45" stop-color="#dcbb7c"/><stop offset="1" stop-color="#9b7338"/></linearGradient>
              <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#e6f2ff"/><stop offset="1" stop-color="#b7c8e8"/></linearGradient>
            </defs>
            <ellipse cx="50" cy="64" rx="28" ry="28" fill="none" stroke="url(#gold)" stroke-width="7"/>
            <path d="M40 34 50 22 60 34 50 42z" fill="url(#gem)" stroke="#fff" stroke-width="1"/>
            <path d="M40 34h20M50 22v20" stroke="#cfe0ff" stroke-width=".8"/>
            <path class="glint" d="M66 18l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#fff"/>
          </svg>
        </div>
        <p class="q__pre fade" style="--d:.3s" data-c="question.pre"></p>
        <h2 class="q__title fade" style="--d:.8s" id="qTitle" data-c="question.title"></h2>
        <div class="q__buttons fade" style="--d:1.6s">
          <button class="yes" type="button" id="yesBtn" data-c="question.yes"></button>
          <button class="no" type="button" id="noBtn" data-c="question.no"></button>
        </div>
      </div>
    </div>
  </section>
</main>

<nav class="progress" id="progress" aria-hidden="true"></nav>

<!-- ============ 4. Celebration ============ -->
<div class="celebrate" id="celebrate" role="dialog" aria-modal="true" aria-labelledby="cTitle" aria-hidden="true">
  <canvas class="fireworks" id="fireworks" aria-hidden="true"></canvas>
  <article class="card">
    <svg class="card__heart" style="--d:.6s" aria-hidden="true"><use href="#i-heart"/></svg>
    <h2 class="card__title" style="--d:.9s" id="cTitle" data-c="yes.title" tabindex="-1"></h2>
    <p class="card__text" style="--d:1.3s" data-c="yes.text"></p>
    <p class="card__sign" style="--d:1.8s" data-c="yes.sign"></p>
    <p class="card__date" style="--d:2s" data-c="yes.date"></p>
    <div class="card__actions" style="--d:2.4s">
      <button class="btn" type="button" id="replay" data-c="yes.replay"></button>
    </div>
    <p style="--d:2.8s; margin-top: 26px"><a class="by" id="madeBy" href="../../index.html">Made by <b>MOMENTLY</b></a></p>
  </article>
</div>

<button class="music" id="musicBtn" type="button" aria-pressed="false" aria-label="მუსიკის ჩართვა"><svg aria-hidden="true"><use href="#i-music"/></svg><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js" defer></script>
</body>
</html>
