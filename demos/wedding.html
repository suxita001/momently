<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giorgi & Salome — მათი დიდი დღე</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f3a2e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Italiana&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+Georgian:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    :root {
      --ivory: #fbf8f1; --green: #1f3a2e; --green-2: #2c4a3c; --gold: #c8a96a; --gold-soft: #e3d2a8; --ink: #1d2a24; --muted: #6b7a70;
      --bg: var(--ivory); --accent: var(--gold);
      --display: "Bodoni Moda", "Noto Serif Georgian", Georgia, serif;
      --caps: "Italiana", "Noto Serif Georgian", serif;
      --body: "EB Garamond", "Noto Serif Georgian", Georgia, serif;
      --loader-bg: var(--green); --loader-ink: var(--gold);
      --nav-ink: var(--ivory); --nav-bg: rgba(31, 58, 46, .92);
      --top-bg: var(--green); --top-ink: var(--gold); --top-line: rgba(200,169,106,.5);
      --cta-bg: var(--green); --cta-ink: var(--ivory); --cta-accent: var(--gold); --cta-btn-bg: var(--gold); --cta-btn-ink: var(--green);
    }
    body { font-size: 1.08rem; }
    .wrap { width: min(1140px, 100% - 40px); margin-inline: auto; }
    .caps { font: 400 .85rem/1 var(--caps); letter-spacing: .42em; text-transform: uppercase; color: var(--gold); }
    html:lang(ka) .caps { font: 400 .85rem/1.4 var(--body); letter-spacing: .12em; }
    .h2 { font: 400 clamp(2.6rem, 5.5vw, 4.4rem)/1.05 var(--display); margin-top: 18px; }
    .h2 em { font-style: italic; color: var(--gold); }
    html:lang(ka) .h2 { font-size: clamp(1.9rem, 4vw, 3rem); line-height: 1.3; }
    html:lang(ka) .h2 em { font-style: normal; }
    .rule { width: 60px; height: 1px; background: var(--gold); margin: 26px 0; }

    /* ---------- Botanical line art ---------- */
    .bot { fill: none; stroke: currentColor; stroke-width: .9; stroke-linecap: round; --draw: 1; }
    .loaded .hero .bot, .bot.in { --draw: 0; }
    #euca path, #euca ellipse, #euca circle { stroke-dasharray: 1; stroke-dashoffset: var(--draw, 0); transition: stroke-dashoffset 3.4s ease; }

    /* ---------- Loader ---------- */
    .ld { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
    .ld svg { position: absolute; inset: 0; }
    .ld circle { fill: none; stroke: var(--gold); stroke-width: .8; stroke-dasharray: 440; stroke-dashoffset: 440; animation: ring 1.6s ease forwards; transform: rotate(-90deg); transform-origin: center; }
    .ld span { font: italic 400 2.2rem/1 var(--display); color: var(--gold-soft); animation: ldFade 1.4s .4s ease both; }
    @keyframes ring { to { stroke-dashoffset: 0; } }
    @keyframes ldFade { from { opacity: 0; letter-spacing: .3em; } }

    /* ---------- Hero ---------- */
    .hero { position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; overflow: hidden; color: var(--ivory); text-align: center; background: var(--green); }
    .hero-bg { position: absolute; inset: 0; }
    .hero-bg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; filter: grayscale(1) contrast(1.05); transform: scale(1.1); transition: transform 3.4s cubic-bezier(.2,.7,.2,1); }
    .loaded .hero-bg img { transform: scale(1); }
    .hero-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(31,58,46,.55), rgba(31,58,46,.35) 45%, rgba(20,38,30,.85)); }
    .corner { position: absolute; z-index: 2; width: clamp(130px, 22vw, 260px); color: var(--gold-soft); }
    .corner svg { display: block; width: 100%; transform-origin: 0 100%; animation: sway 8s ease-in-out infinite alternate; }
    .corner--tl { top: 60px; left: 0; transform: scaleY(-1); }
    .corner--tr { top: 60px; right: 0; transform: scale(-1, -1); }
    .corner--bl { bottom: 0; left: 0; }
    .corner--br { bottom: 0; right: 0; transform: scaleX(-1); }
    .corner--tr svg, .corner--bl svg { animation-duration: 10s; animation-delay: -3s; }
    @keyframes sway { from { transform: rotate(-1.5deg); } to { transform: rotate(2deg); } }
    .hero-in { position: relative; z-index: 3; padding: 130px 20px 100px; }
    .hero-names { font: italic 400 clamp(3.6rem, 10vw, 8rem)/1 var(--display); margin: 30px 0 22px; }
    .hero-names .amp { display: block; font: 400 .5em/1.3 var(--caps); color: var(--gold); font-style: normal; }
    .hero-sub { font: italic 400 clamp(1.3rem, 2.4vw, 1.8rem)/1.3 var(--body); color: var(--gold-soft); }
    html:lang(ka) .hero-sub { font-style: normal; font-size: clamp(1.1rem, 2vw, 1.4rem); }
    .hero-date { margin-top: 26px; font: 400 1rem/1 var(--caps); letter-spacing: .5em; }
    .hm { display: block; overflow: hidden; padding-bottom: .1em; }
    .hm > * { display: block; transform: translateY(110%); transition: transform 1.4s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d); }
    .loaded .hm > * { transform: none; }

    /* ---------- Our story ---------- */
    .story { padding: clamp(110px, 15vw, 180px) 0; }
    .story-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(50px, 8vw, 110px); align-items: center; }
    .story-imgs { position: relative; padding-bottom: 90px; }
    .story-main { width: 78%; aspect-ratio: 4 / 5; overflow: hidden; }
    .story-small { position: absolute; right: 0; bottom: 0; width: 46%; }
    .story-small figure { aspect-ratio: 1; overflow: hidden; border: 10px solid var(--ivory); box-shadow: 0 30px 50px -30px rgba(29,42,36,.5); }
    .story-text p { color: var(--muted); margin-bottom: 18px; max-width: 30em; }
    .story-text .mono { font: italic 400 2rem var(--display); color: var(--gold); margin-top: 30px; }

    /* ---------- The day ---------- */
    .day { background: var(--green); color: var(--ivory); padding: clamp(110px, 15vw, 180px) 0; text-align: center; position: relative; overflow: hidden; }
    .day-date { font: 400 clamp(3.4rem, 9vw, 7rem)/1 var(--display); margin: 26px 0 10px; }
    .day-date em { font-style: italic; color: var(--gold); }
    html:lang(ka) .day-date { font-size: clamp(2.4rem, 6.4vw, 5rem); line-height: 1.25; }
    html:lang(ka) .day-date em { font-style: normal; }
    .day-sub { font: 400 1rem var(--caps); letter-spacing: .3em; color: var(--gold-soft); }
    html:lang(ka) .day-sub { font-family: var(--body); letter-spacing: .08em; }
    .day-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: clamp(30px, 6vw, 80px); max-width: 820px; margin: 80px auto 0; align-items: start; }
    .day-line { width: 1px; background: linear-gradient(transparent, var(--gold), transparent); align-self: stretch; }
    .ev svg { width: 58px; height: 58px; color: var(--gold); margin: 0 auto 20px; }
    .ev time { display: block; font: 400 3.4rem/1 var(--display); color: var(--ivory); margin: 14px 0 10px; }
    .ev p { color: #c5cfc8; }
    .day .caps { color: var(--gold); }

    /* ---------- Countdown ---------- */
    .count { padding: clamp(110px, 15vw, 180px) 0; text-align: center; }
    .cd { display: flex; justify-content: center; gap: clamp(14px, 4vw, 56px); margin-top: 60px; }
    .cd div { min-width: clamp(64px, 14vw, 140px); }
    .cd .num { display: block; overflow: hidden; height: 1.1em; font: 400 clamp(3rem, 9vw, 6.4rem)/1.1 var(--display); font-variant-numeric: lining-nums tabular-nums; }
    .cd .num b { display: block; font-weight: 400; }
    .cd .num b.tick { animation: slideUp .7s cubic-bezier(.2,.8,.2,1); }
    @keyframes slideUp { from { transform: translateY(80%); opacity: 0; } }
    .cd small { display: block; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--gold); font: 400 .8rem var(--caps); letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
    html:lang(ka) .cd small { font-family: var(--body); letter-spacing: .06em; text-transform: none; font-size: .9rem; }
    .cd-done { font: italic 400 2.4rem var(--display); color: var(--gold); margin-top: 40px; }

    /* ---------- Location ---------- */
    .loc { padding: 0 0 clamp(110px, 15vw, 180px); }
    .loc-card { display: grid; grid-template-columns: 1fr 1fr; background: #fff; box-shadow: 0 40px 80px -50px rgba(29,42,36,.45); }
    .loc-img { min-height: 460px; overflow: hidden; }
    .loc-img img { height: 100%; }
    .loc-body { padding: clamp(40px, 6vw, 80px); display: flex; flex-direction: column; justify-content: center; }
    .loc-body h3 { font: italic 400 clamp(2.2rem, 4vw, 3.2rem)/1.1 var(--display); margin: 20px 0 16px; }
    html:lang(ka) .loc-body h3 { font-style: normal; font-size: clamp(1.7rem, 3vw, 2.3rem); }
    .loc-body p { color: var(--muted); }
    .btn-line { align-self: flex-start; margin-top: 30px; display: inline-flex; gap: 12px; align-items: center; padding: 15px 28px; border: 1px solid var(--green); color: var(--green); font: 400 .82rem var(--caps); letter-spacing: .28em; text-transform: uppercase; transition: background .4s, color .4s; }
    html:lang(ka) .btn-line { font: 500 .95rem var(--body); letter-spacing: .04em; }
    .btn-line:hover { background: var(--green); color: var(--ivory); }

    /* ---------- Gallery ---------- */
    .gal { background: #f3eee2; padding: clamp(110px, 15vw, 180px) 0; overflow: hidden; }
    .gal-head { text-align: center; margin-bottom: 70px; }
    .gal-grid { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: clamp(14px, 2vw, 26px); align-items: start; }
    .gal-col { display: grid; gap: clamp(14px, 2vw, 26px); }
    .gal-col:nth-child(2) { margin-top: 80px; }
    .gal-col figure { overflow: hidden; }
    .gal-col img { transition: transform 1.6s cubic-bezier(.2,.8,.2,1); }
    .gal-col figure:hover img { transform: scale(1.05); }
    .ar-45 { aspect-ratio: 4 / 5; } .ar-34 { aspect-ratio: 3 / 4; } .ar-11 { aspect-ratio: 1; } .ar-23 { aspect-ratio: 2 / 3; }

    /* ---------- Final ---------- */
    .final { position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; overflow: hidden; text-align: center; color: var(--ivory); }
    .final-bg { position: absolute; inset: -12% 0; }
    .final-bg::after { content: ""; position: absolute; inset: 0; background: rgba(20,38,30,.62); }
    .final-in { position: relative; z-index: 2; padding: 100px 20px; }
    .final h2 { font: italic 400 clamp(2.8rem, 7vw, 5.6rem)/1.1 var(--display); max-width: 12em; margin: 26px auto 22px; }
    html:lang(ka) .final h2 { font-style: normal; font-size: clamp(2rem, 4.6vw, 3.4rem); line-height: 1.35; }
    .final p { color: var(--gold-soft); }
    .rsvp { display: inline-flex; align-items: center; justify-content: center; margin-top: 40px; width: 150px; height: 150px; border-radius: 50%; border: 1px solid var(--gold); color: var(--ivory); font: 400 1.2rem var(--caps); letter-spacing: .3em; position: relative; transition: background .5s, color .5s; }
    .rsvp::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; border: 1px solid rgba(200,169,106,.4); transition: transform .6s; }
    .rsvp:hover { background: var(--gold); color: var(--green); }
    .rsvp:hover::before { transform: scale(1.15); }

    @media (max-width: 860px) {
      .story-grid, .loc-card { grid-template-columns: 1fr; }
      .loc-img { min-height: 300px; }
      .day-grid { grid-template-columns: 1fr; gap: 50px; }
      .day-line { height: 1px; width: 80px; margin: 0 auto; background: var(--gold); }
      .gal-grid { grid-template-columns: 1fr 1fr; }
      .gal-col:nth-child(2) { margin-top: 50px; }
      .gal-col:nth-child(3) { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; }
      .corner--tr, .corner--bl { display: none; }
      .cd .num { font-size: clamp(2.4rem, 11vw, 3rem); }
    }
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="euca" viewBox="0 0 240 240">
    <path pathLength="1" d="M4 236 C 40 182, 88 142, 138 112 S 208 52, 236 4"/>
    <path pathLength="1" d="M92 146 C 80 120, 84 100, 100 82"/>
    <ellipse pathLength="1" cx="24" cy="200" rx="7" ry="13" transform="rotate(-50 24 200)"/>
    <ellipse pathLength="1" cx="46" cy="190" rx="7" ry="13" transform="rotate(40 46 190)"/>
    <ellipse pathLength="1" cx="56" cy="160" rx="7" ry="13" transform="rotate(-40 56 160)"/>
    <ellipse pathLength="1" cx="84" cy="160" rx="7" ry="13" transform="rotate(50 84 160)"/>
    <ellipse pathLength="1" cx="112" cy="116" rx="7" ry="13" transform="rotate(-35 112 116)"/>
    <ellipse pathLength="1" cx="140" cy="128" rx="7" ry="13" transform="rotate(60 140 128)"/>
    <ellipse pathLength="1" cx="160" cy="86" rx="7" ry="13" transform="rotate(-30 160 86)"/>
    <ellipse pathLength="1" cx="186" cy="88" rx="7" ry="12" transform="rotate(60 186 88)"/>
    <ellipse pathLength="1" cx="196" cy="48" rx="6" ry="11" transform="rotate(-25 196 48)"/>
    <ellipse pathLength="1" cx="218" cy="44" rx="6" ry="11" transform="rotate(55 218 44)"/>
    <ellipse pathLength="1" cx="88" cy="96" rx="6" ry="11" transform="rotate(-10 88 96)"/>
    <circle pathLength="1" cx="100" cy="80" r="3"/><circle pathLength="1" cx="107" cy="75" r="2.4"/><circle pathLength="1" cx="236" cy="4" r="2.4"/>
  </symbol>
</svg>

<div class="dm-loader" aria-hidden="true">
  <div class="ld"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="70"/></svg><span>G&amp;S</span></div>
</div>

<main>
  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="hero-bg"><img data-img="1460978812857-470ed1c77af0" data-eager data-t-attr="alt:alt.hero"></div>
    <canvas class="dm-fx" id="dust" aria-hidden="true" style="z-index:2"></canvas>
    <div class="corner corner--tl" aria-hidden="true"><svg class="bot" viewBox="0 0 240 240"><use href="#euca"/></svg></div>
    <div class="corner corner--tr" aria-hidden="true"><svg class="bot" viewBox="0 0 240 240"><use href="#euca"/></svg></div>
    <div class="corner corner--bl" aria-hidden="true"><svg class="bot" viewBox="0 0 240 240"><use href="#euca"/></svg></div>
    <div class="corner corner--br" aria-hidden="true"><svg class="bot" viewBox="0 0 240 240"><use href="#euca"/></svg></div>
    <div class="hero-in">
      <span class="hm" style="--d:.3s"><span class="caps" data-t="hero.label"></span></span>
      <h1 class="hero-names">
        <span class="hm" style="--d:.6s"><span>Giorgi</span></span>
        <span class="hm" style="--d:.9s"><span class="amp">&amp;</span></span>
        <span class="hm" style="--d:1.1s"><span>Salome</span></span>
      </h1>
      <span class="hm" style="--d:1.6s"><span class="hero-sub" data-t="hero.sub"></span></span>
      <span class="hm" style="--d:1.9s"><span class="hero-date" id="heroDate"></span></span>
    </div>
  </section>

  <!-- ============ OUR STORY ============ -->
  <section class="story wrap">
    <div class="story-grid">
      <div class="story-imgs">
        <figure class="story-main rv-img"><img class="dm-img" data-img="1550005809-91ad75fb315f" data-w="1200" data-sizes="(max-width: 860px) 70vw, 420px"></figure>
        <div class="story-small" data-speed="-0.12"><figure class="rv-img" style="--d:.3s"><img class="dm-img" data-img="1529634806980-85c3dd6d34ac" data-w="800" data-sizes="(max-width: 860px) 45vw, 250px"></figure></div>
      </div>
      <div class="story-text">
        <p class="caps rv" data-t="story.label"></p>
        <h2 class="h2 rv" style="--d:.1s" data-t-html="story.title"></h2>
        <div class="rule rv" style="--d:.15s"></div>
        <p class="rv" style="--d:.2s" data-t="story.p1"></p>
        <p class="rv" style="--d:.3s" data-t="story.p2"></p>
        <p class="mono rv" style="--d:.4s">G &amp; S</p>
      </div>
    </div>
  </section>

  <!-- ============ THE DAY ============ -->
  <section class="day">
    <canvas class="dm-fx" id="dust2" aria-hidden="true"></canvas>
    <div class="wrap" style="position:relative">
      <p class="caps rv" data-t="day.label"></p>
      <p class="day-date rv" style="--d:.1s" id="dayDate"></p>
      <p class="day-sub rv" style="--d:.2s" id="daySub"></p>
      <div class="day-grid">
        <div class="ev rv" style="--d:.2s">
          <svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><circle cx="23" cy="36" r="14"/><circle cx="37" cy="36" r="14"/><path d="M33 16 l4 -6 l4 6 l-4 4 z"/></svg>
          <p class="caps" data-t="day.ceremony"></p>
          <time>18:00</time>
          <p data-t="day.ceremonyAt"></p>
        </div>
        <div class="day-line" aria-hidden="true"></div>
        <div class="ev rv" style="--d:.35s">
          <svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M14 12 h14 c0 12 -3 18 -7 18 s-7 -6 -7 -18 z M21 30 v16 M15 46 h12"/><path d="M32 12 h14 c0 12 -3 18 -7 18 s-7 -6 -7 -18 z M39 30 v16 M33 46 h12"/><path d="M28 8 l2 -4 M30 9 l4 -2"/></svg>
          <p class="caps" data-t="day.reception"></p>
          <time>20:00</time>
          <p data-t="day.receptionAt"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ COUNTDOWN ============ -->
  <section class="count wrap">
    <p class="caps rv" data-t="cd.label"></p>
    <h2 class="h2 rv" style="--d:.1s" data-t-html="cd.title"></h2>
    <div class="cd rv" style="--d:.2s" id="cd">
      <div><span class="num"><b data-cd="d">0</b></span><small data-t="u.d"></small></div>
      <div><span class="num"><b data-cd="h">00</b></span><small data-t="u.h"></small></div>
      <div><span class="num"><b data-cd="m">00</b></span><small data-t="u.m"></small></div>
      <div><span class="num"><b data-cd="s">00</b></span><small data-t="u.s"></small></div>
    </div>
  </section>

  <!-- ============ LOCATION ============ -->
  <section class="loc wrap">
    <div class="loc-card rv">
      <div class="loc-img rv-img"><img class="dm-img" data-img="1523438885200-e635ba2c371e" data-w="1200" data-sizes="(max-width: 860px) 100vw, 570px" data-t-attr="alt:alt.loc"></div>
      <div class="loc-body">
        <p class="caps" data-t="loc.label"></p>
        <h3 data-t="loc.name"></h3>
        <p data-t="loc.address"></p>
        <p data-t="loc.note"></p>
        <a class="btn-line" href="https://www.google.com/maps/search/?api=1&amp;query=Chateau+Mukhrani" target="_blank" rel="noopener"><span data-t="loc.btn"></span><span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </section>

  <!-- ============ GALLERY ============ -->
  <section class="gal">
    <div class="wrap">
      <header class="gal-head">
        <p class="caps rv" data-t="gal.label"></p>
        <h2 class="h2 rv" style="--d:.1s" data-t-html="gal.title"></h2>
      </header>
      <div class="gal-grid">
        <div class="gal-col" data-speed="0.04">
          <figure class="ar-34 rv-img"><img class="dm-img" data-img="1583939003579-730e3918a45a" data-w="800" data-sizes="(max-width: 860px) 50vw, 340px"></figure>
          <figure class="ar-11 rv-img" style="--d:.1s"><img class="dm-img" data-img="1606800052052-a08af7148866" data-w="800" data-sizes="(max-width: 860px) 50vw, 340px"></figure>
        </div>
        <div class="gal-col" data-speed="-0.06">
          <figure class="ar-23 rv-img" style="--d:.15s"><img class="dm-img" data-img="1537633552985-df8429e8048b" data-w="1200" data-sizes="(max-width: 860px) 50vw, 430px"></figure>
          <figure class="ar-45 rv-img" style="--d:.25s"><img class="dm-img" data-img="1525258946800-98cfd641d0de" data-w="800" data-sizes="(max-width: 860px) 50vw, 430px"></figure>
        </div>
        <div class="gal-col" data-speed="0.08">
          <figure class="ar-11 rv-img" style="--d:.2s"><img class="dm-img" data-img="1469371670807-013ccf25f16a" data-w="800" data-sizes="(max-width: 860px) 50vw, 340px"></figure>
          <figure class="ar-34 rv-img" style="--d:.3s"><img class="dm-img" data-img="1544078751-58fee2d8a03b" data-w="800" data-sizes="(max-width: 860px) 50vw, 340px"></figure>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ FINAL / RSVP ============ -->
  <section class="final">
    <div class="final-bg" data-speed="0.1"><img class="dm-img" data-img="1519741497674-611481863552" data-t-attr="alt:alt.final"></div>
    <div class="final-in">
      <p class="caps rv" data-t="final.label"></p>
      <h2 class="rv" style="--d:.1s" data-t="final.title"></h2>
      <p class="rv" style="--d:.2s" data-t="final.note"></p>
      <a class="rsvp rv" style="--d:.3s" href="#" data-share="msg.rsvp" data-t-attr="aria-label:final.btnLabel">RSVP</a>
    </div>
  </section>

  <div id="dm-cta"></div>
