<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>მოგესალმები, პატარა ლუკა</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fbf6ee">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Quicksand:wght@400;500;600&family=Noto+Serif+Georgian:wght@300;400;500&family=Noto+Sans+Georgian:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    :root {
      --cream: #fbf6ee; --blue: #cfe0ee; --blue-2: #9dbbd6; --blue-ink: #4a6588; --beige: #eadfce; --moon: #f3e2b3; --ink: #3d4a5c; --muted: #7a8595;
      --night: #2e4466; --night-2: #5b7ba0;
      --bg: var(--cream); --accent: var(--blue-2);
      --display: "Cormorant Infant", "Noto Serif Georgian", Georgia, serif;
      --body: "Quicksand", "Noto Sans Georgian", system-ui, sans-serif;
      --loader-bg: var(--cream); --loader-ink: var(--blue-ink);
      --nav-ink: var(--blue-ink); --nav-bg: rgba(251, 246, 238, .9);
      --top-bg: #fff; --top-ink: var(--blue-ink); --top-line: var(--blue);
      --cta-bg: var(--cream); --cta-ink: var(--ink); --cta-accent: var(--blue-ink); --cta-btn-bg: var(--blue-ink); --cta-btn-ink: #fff;
    }
    body { font-weight: 500; }
    .wrap { width: min(1120px, 100% - 40px); margin-inline: auto; }
    .soft { display: inline-block; font: 600 .75rem/1 var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--blue-ink); }
    html:lang(ka) .soft { letter-spacing: .05em; text-transform: none; font-size: .85rem; }
    .h2 { font: 400 clamp(2.4rem, 5vw, 3.8rem)/1.1 var(--display); margin-top: 14px; }
    .h2 em { font-style: italic; color: var(--blue-ink); }
    html:lang(ka) .h2 { font-weight: 300; font-size: clamp(1.8rem, 3.6vw, 2.7rem); line-height: 1.35; }
    html:lang(ka) .h2 em { font-style: normal; }
    .star { position: absolute; width: var(--s, 14px); fill: var(--moon); animation: twinkle var(--t, 3s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
    @keyframes twinkle { 50% { opacity: .25; transform: scale(.6) rotate(20deg); } }

    /* ---------- Loader ---------- */
    .ld { position: relative; width: 120px; height: 120px; }
    .ld .moon { width: 80px; position: absolute; left: 20px; top: 20px; fill: var(--moon); animation: rock 2s ease-in-out infinite; transform-origin: 50% 20%; }
    .ld .star { --s: 14px; }
    @keyframes rock { 50% { transform: rotate(-12deg); } }

    /* ---------- Hero ---------- */
    .hero { position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden; display: flex; align-items: center; padding: 110px 0 80px; }
    .hero::before { content: ""; position: absolute; right: -10vw; top: -10vw; width: 60vw; height: 60vw; border-radius: 50%; background: radial-gradient(circle, var(--blue) 0%, rgba(207,224,238,0) 70%); }
    .cloud { position: absolute; fill: #fff; filter: drop-shadow(0 10px 20px rgba(74,101,136,.08)); animation: drift var(--t, 40s) ease-in-out infinite alternate; }
    .cloud--1 { width: 200px; left: 4%; top: 16%; --t: 36s; }
    .cloud--2 { width: 140px; right: 8%; bottom: 14%; --t: 44s; animation-delay: -10s; }
    .cloud--3 { width: 110px; left: 42%; top: 10%; --t: 30s; opacity: .8; }
    @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(40px); } }
    .hero .moon { position: absolute; width: 90px; right: 12%; top: 15%; fill: var(--moon); transform-origin: 50% 0; animation: rock 7s ease-in-out infinite; }
    .hero-grid { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(30px, 6vw, 90px); align-items: center; }
    .hero-text > * { opacity: 0; transform: translateY(18px); transition: opacity 1.4s, transform 1.4s cubic-bezier(.2,.8,.2,1); }
    .loaded .hero-text > * { opacity: 1; transform: none; }
    .loaded .hero-text > :nth-child(2) { transition-delay: .3s; } .loaded .hero-text > :nth-child(3) { transition-delay: .6s; } .loaded .hero-text > :nth-child(4) { transition-delay: .9s; }
    .hero h1 { font: 300 clamp(3.2rem, 7.4vw, 6.2rem)/1 var(--display); margin: 20px 0 18px; }
    .hero h1 em { display: block; font-style: italic; color: var(--blue-ink); font-weight: 400; }
    html:lang(ka) .hero h1 { font-size: clamp(2.4rem, 5vw, 4rem); line-height: 1.3; }
    html:lang(ka) .hero h1 em { font-style: normal; }
    .hero-sub { font: italic 400 clamp(1.3rem, 2.4vw, 1.8rem) var(--display); color: var(--muted); }
    html:lang(ka) .hero-sub { font-style: normal; font-size: clamp(1.05rem, 2vw, 1.35rem); }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
    .chips span { background: #fff; border-radius: 99px; padding: 10px 18px; font-size: .88rem; color: var(--blue-ink); box-shadow: 0 10px 24px -16px rgba(74,101,136,.5); }
    .portrait { position: relative; justify-self: center; width: min(460px, 100%); }
    .portrait figure { border-radius: 50%; overflow: hidden; aspect-ratio: 1; border: 12px solid #fff; box-shadow: 0 40px 80px -40px rgba(74,101,136,.5); transform: scale(.9); opacity: 0; transition: transform 2s .3s cubic-bezier(.2,.8,.2,1), opacity 1.6s .3s; }
    .loaded .portrait figure { transform: none; opacity: 1; }
    .portrait .star { z-index: 2; }

    /* ---------- Timeline ---------- */
    .journey { padding: clamp(110px, 14vw, 170px) 0; text-align: center; }
    .path-wrap { position: relative; margin-top: 70px; }
    .path { position: absolute; left: 8%; right: 8%; top: 110px; width: 84%; height: 60px; color: var(--blue-2); }
    .path path { fill: none; stroke: currentColor; stroke-width: 2; stroke-dasharray: 2 10; stroke-linecap: round; }
    .steps { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
    .step-img { width: 220px; aspect-ratio: 1; margin: 0 auto 28px; border-radius: 50%; overflow: hidden; border: 8px solid #fff; box-shadow: 0 30px 50px -30px rgba(74,101,136,.5); }
    .step:nth-child(2) { margin-top: 70px; }
    .step h3 { font: 400 1.9rem/1.2 var(--display); margin-bottom: 10px; }
    html:lang(ka) .step h3 { font-size: 1.35rem; }
    .step p { color: var(--muted); max-width: 20em; margin: 0 auto; font-weight: 400; }
    .step .soft { margin-bottom: 12px; color: var(--blue-2); }

    /* ---------- Gallery ---------- */
    .gal { background: var(--blue); padding: clamp(110px, 14vw, 170px) 0; position: relative; overflow: hidden; }
    .gal-head { text-align: center; margin-bottom: 60px; }
    .gal-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px; align-items: start; }
    .g { transition: transform .8s cubic-bezier(.2,.8,.2,1); }
    .g:hover { transform: translateY(-8px); }
    .g figure { overflow: hidden; border: 8px solid #fff; box-shadow: 0 24px 40px -26px rgba(61,74,92,.55); }
    .g figcaption { margin-top: 12px; text-align: center; font: italic 400 1.2rem var(--display); color: var(--blue-ink); }
    html:lang(ka) .g figcaption { font-style: normal; font-size: .95rem; }
    .g1 { grid-column: span 2; } .g1 figure { border-radius: 200px 200px 24px 24px; aspect-ratio: 3 / 4; }
    .g2 { grid-column: span 2; margin-top: 80px; } .g2 figure { border-radius: 50%; aspect-ratio: 1; }
    .g3 { grid-column: span 2; } .g3 figure { border-radius: 24px; aspect-ratio: 4 / 5; }
    .g4 { grid-column: 2 / span 2; margin-top: 10px; } .g4 figure { border-radius: 24px 24px 200px 200px; aspect-ratio: 3 / 4; }
    .g5 { grid-column: span 2; margin-top: 70px; } .g5 figure { border-radius: 50%; aspect-ratio: 1; }

    /* ---------- Letter ---------- */
    .letter { padding: clamp(110px, 14vw, 170px) 20px; }
    .letter-card { position: relative; max-width: 700px; margin: 0 auto; background: #fff; border-radius: 40px; padding: clamp(50px, 8vw, 90px) clamp(28px, 7vw, 80px); text-align: center; box-shadow: 0 40px 80px -50px rgba(74,101,136,.5); }
    .letter-card .moon { width: 46px; fill: var(--moon); margin: 0 auto 24px; }
    .letter-card h3 { font: italic 400 2.2rem var(--display); color: var(--blue-ink); margin-bottom: 22px; }
    html:lang(ka) .letter-card h3 { font-style: normal; font-size: 1.5rem; }
    .letter-card p { font: 400 1.25rem/1.75 var(--display); margin-bottom: 16px; }
    html:lang(ka) .letter-card p { font-size: 1.05rem; line-height: 1.9; }
    .letter-card .sign { font: italic 400 1.4rem var(--display); color: var(--blue-ink); margin-top: 24px; }
    html:lang(ka) .letter-card .sign { font-style: normal; font-size: 1.1rem; }

    /* ---------- Night sky finale ---------- */
    .night { position: relative; overflow: hidden; min-height: 90vh; display: grid; place-items: center; text-align: center; color: #fff; background: linear-gradient(180deg, var(--night) 0%, var(--night-2) 75%, #9dbbd6 100%); }
    .night .moon { position: absolute; width: 120px; top: 14%; left: 50%; margin-left: -60px; fill: var(--moon); filter: drop-shadow(0 0 30px rgba(243,226,179,.5)); animation: rock 9s ease-in-out infinite; transform-origin: 50% 0; }
    .night-in { position: relative; z-index: 2; padding: 200px 20px 160px; }
    .night h2 { font: 300 clamp(2.6rem, 6.4vw, 5.2rem)/1.15 var(--display); max-width: 13em; margin: 0 auto; }
    .night h2 em { font-style: italic; color: var(--moon); }
    html:lang(ka) .night h2 { font-size: clamp(1.9rem, 4.4vw, 3.4rem); line-height: 1.4; }
    html:lang(ka) .night h2 em { font-style: normal; }
    .night p { margin-top: 24px; color: rgba(255,255,255,.75); }
    .night-clouds { position: absolute; left: 0; right: 0; bottom: -2px; height: 120px; z-index: 3; }

    @media (max-width: 860px) {
      .hero-grid { grid-template-columns: 1fr; text-align: center; }
      .chips { justify-content: center; }
      .portrait { width: min(320px, 82%); order: -1; }
      .hero .moon { width: 60px; right: 6%; top: 12%; }
      .cloud--3, .gal > .cloud { display: none; }
      .path { display: none; }
      .steps { grid-template-columns: 1fr; gap: 60px; }
      .step:nth-child(2) { margin-top: 0; }
      .step-img { width: 190px; }
      .gal-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
      .g1, .g2, .g3, .g4, .g5 { grid-column: auto; margin-top: 0; }
      .g2, .g4 { margin-top: 40px; }
      .g5 { grid-column: 1 / -1; width: 60%; justify-self: center; }
    }
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cloud" viewBox="0 0 120 64"><path d="M22 62 a20 20 0 0 1 2 -40 a26 26 0 0 1 48 -10 a22 22 0 0 1 34 20 a16 16 0 0 1 -2 30 z"/></symbol>
  <symbol id="moon" viewBox="0 0 100 100"><path d="M62 6 A46 46 0 1 0 94 70 A38 38 0 1 1 62 6 Z"/></symbol>
  <symbol id="star" viewBox="0 0 20 20"><path d="M10 0 C11 7 13 9 20 10 C13 11 11 13 10 20 C9 13 7 11 0 10 C7 9 9 7 10 0 Z"/></symbol>
</svg>

<div class="dm-loader" aria-hidden="true">
  <div class="ld">
    <svg class="moon" viewBox="0 0 100 100"><use href="#moon"/></svg>
    <svg class="star" style="left:4px;top:10px" viewBox="0 0 20 20"><use href="#star"/></svg>
    <svg class="star" style="right:0;top:0;--dl:-1s;--s:10px" viewBox="0 0 20 20"><use href="#star"/></svg>
    <svg class="star" style="right:8px;bottom:6px;--dl:-2s;--s:12px" viewBox="0 0 20 20"><use href="#star"/></svg>
  </div>
</div>

<main>
  <!-- ============ HERO ============ -->
  <section class="hero">
    <canvas class="dm-fx" id="dust" aria-hidden="true"></canvas>
    <svg class="cloud cloud--1" viewBox="0 0 120 64" aria-hidden="true"><use href="#cloud"/></svg>
    <svg class="cloud cloud--2" viewBox="0 0 120 64" aria-hidden="true"><use href="#cloud"/></svg>
    <svg class="cloud cloud--3" viewBox="0 0 120 64" aria-hidden="true"><use href="#cloud"/></svg>
    <svg class="moon" viewBox="0 0 100 100" aria-hidden="true"><use href="#moon"/></svg>
    <svg class="star" style="left:30%;top:22%;--dl:-1s" viewBox="0 0 20 20" aria-hidden="true"><use href="#star"/></svg>
    <svg class="star" style="right:26%;top:30%;--s:10px;--t:4s" viewBox="0 0 20 20" aria-hidden="true"><use href="#star"/></svg>
    <svg class="star" style="left:8%;bottom:20%;--s:18px;--dl:-2s" viewBox="0 0 20 20" aria-hidden="true"><use href="#star"/></svg>
    <div class="wrap hero-grid">
      <div class="hero-text">
        <p class="soft" data-t="hero.label"></p>

        <figure><img class="dm-img" data-img="1544126592-807ade215a0b" data-eager data-w="1200" data-sizes="(max-width: 860px) 82vw, 460px" data-t-attr="alt:alt.hero"></figure>
        <svg class="star" style="right:6%;top:4%;--s:26px" viewBox="0 0 20 20" aria-hidden="true"><use href="#star"/></svg>
        <svg class="star" style="left:0;bottom:12%;--s:18px;--dl:-1.5s" viewBox="0 0 20 20" aria-hidden="true"><use href="#star"/></svg>
      </div>
    </div>
  </section>

  <!-- ============ TIMELINE ============ -->
  <section class="journey wrap">
    <p class="soft rv" data-t="j.label"></p>
    <h2 class="h2 rv" style="--d:.1s" data-t-html="j.title"></h2>
    <div class="path-wrap">
      <svg class="path" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 C 160 -10, 330 70, 500 30 S 840 -10, 1000 30"/></svg>
      <div class="steps">
        <article class="step rv"><div class="step-img"><img class="dm-img" data-img="1515488042361-ee00e0ddd4e4" data-w="480" data-sizes="220px"></div><p class="soft">01</p><h3 data-t="s1.t"></h3><p data-t="s1.p"></p></article>
        <article class="step rv" style="--d:.2s"><div class="step-img"><img class="dm-img" data-img="1555252333-9f8e92e65df9" data-w="480" data-sizes="220px"></div><p class="soft">02</p><h3 data-t="s2.t"></h3><p data-t="s2.p"></p></article>
        <article class="step rv" style="--d:.4s"><div class="step-img"><img class="dm-img" data-img="1492725764893-90b379c2b6e7" data-w="480" data-sizes="220px"></div><p class="soft">03</p><h3 data-t="s3.t"></h3><p data-t="s3.p"></p></article>
      </div>
    </div>
  </section>

  <!-- ============ GALLERY ============ -->
  <section class="gal">
    <svg class="cloud" style="width:180px;right:4%;top:60px;--t:50s" viewBox="0 0 120 64" aria-hidden="true"><use href="#cloud"/></svg>
    <div class="wrap">
      <header class="gal-head">
        <p class="soft rv" data-t="g.label"></p>
        <h2 class="h2 rv" style="--d:.1s" data-t-html="g.title"></h2>
      </header>
      <div class="gal-grid">
        <figure class="g g1 rv"><figure class="rv-img"><img class="dm-img" data-img="1546015720-b8b30df5aa27" data-w="800" data-sizes="(max-width: 860px) 50vw, 360px"></figure><figcaption data-t="g1"></figcaption></figure>
        <figure class="g g2 rv" style="--d:.15s"><figure class="rv-img"><img class="dm-img" data-img="1522771930-78848d9293e8" data-w="800" data-sizes="(max-width: 860px) 50vw, 360px"></figure><figcaption data-t="g2"></figcaption></figure>
        <figure class="g g3 rv" style="--d:.3s"><figure class="rv-img"><img class="dm-img" data-img="1491013516836-7db643ee125a" data-w="800" data-sizes="(max-width: 860px) 50vw, 360px"></figure><figcaption data-t="g3"></figcaption></figure>
        <figure class="g g4 rv" style="--d:.1s"><figure class="rv-img"><img class="dm-img" data-img="1566004100631-35d015d6a491" data-w="800" data-sizes="(max-width: 860px) 50vw, 360px"></figure><figcaption data-t="g4"></figcaption></figure>
        <figure class="g g5 rv" style="--d:.25s"><figure class="rv-img"><img class="dm-img" data-img="1519238263530-99bdd11df2ea" data-w="800" data-sizes="(max-width: 860px) 60vw, 360px"></figure><figcaption data-t="g5"></figcaption></figure>
      </div>
    </div>
  </section>

  <!-- ============ LETTER ============ -->
  <section class="letter">
    <div class="letter-card rv">
      <svg class="moon" viewBox="0 0 100 100" aria-hidden="true"><use href="#moon"/></svg>
      <h3 data-t="l.to"></h3>
      <p data-t="l.p1"></p>
      <p data-t="l.p2"></p>
      <p class="sign" data-t="l.sign"></p>
    </div>
  </section>

  <!-- ============ NIGHT SKY FINALE ============ -->
  <section class="night">
    <canvas class="dm-fx" id="stars" aria-hidden="true"></canvas>
    <svg class="moon" viewBox="0 0 100 100" aria-hidden="true"><use href="#moon"/></svg>
    <div class="night-in">
      <h2 class="rv" data-t-html="n.title"></h2>
      <p class="rv" style="--d:.2s" data-t="n.sub"></p>
    </div>
    <svg class="night-clouds" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true"><path fill="#fbf6ee" d="M0 120 V70 C 60 40, 120 40, 170 62 C 210 30, 290 26, 330 60 C 380 20, 470 24, 500 64 C 560 34, 640 36, 680 70 C 730 30, 820 30, 860 66 C 910 36, 990 34, 1030 64 C 1080 26, 1170 28, 1210 62 C 1260 36, 1340 38, 1380 64 C 1400 56, 1420 56, 1440 60 V120 Z"/></svg>
  </section>

  <div id="dm-cta"></div>
</main>
